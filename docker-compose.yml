version: '3.9'
services:
  api:
    build: ./apps/api
    ports:
      - '8000:8000'
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web
    volumes:
      - ./:/workspace
    ports:
      - '3000:3000'
    command: sh -c "npm install && npm run dev"
